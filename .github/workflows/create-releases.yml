name: Create releases and tags
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}
jobs:
  unreleased-prs-metadata:
    name: Get list of pending release pull requests
    permissions:
      pull-requests: read
      contents: read
    uses: equinor/radix-reusable-workflows/.github/workflows/template-unreleased-pr-metadata.yml@tag-release-even-if-it-is-draft # v1.2.0

  release-pull-request:
    name: Release pull request
    needs:
      - unreleased-prs-metadata
    if: needs.unreleased-prs-metadata.outputs.unreleased-pull-request-count > 0
    strategy:
      matrix:
        pull-request-number: ${{ fromJson(needs.unreleased-prs-metadata.outputs.unreleased-pull-requests) }}
    permissions:
      pull-requests: write
      contents: read
      issues: write
    uses: equinor/radix-reusable-workflows/.github/workflows/template-create-release-from-pr.yml@tag-release-even-if-it-is-draft # v1.2.0
    with:
      pull-request-number: ${{ matrix.pull-request-number }}
      use-github-app-token: true
      github-app-id: ${{ vars.GH_APP_ID }}
      set-draft: true
    secrets:
      github-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  tag:
    needs:
      - release-pull-request
      - unreleased-prs-metadata
    if: needs.unreleased-prs-metadata.outputs.unreleased-pull-request-count == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Step 1: Generate the Installation Access Token
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-workflows: write
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
