name: CD

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+" # semver stable

permissions:
    contents: write
    packages: write

env:
    IMAGE_NAME: ghcr.io/richard87/radix-cli # ghcr.io/equinor/radix/rx

jobs:
    build-binaries:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            FLAGS: "-s -w -X github.com/equinor/radix-cli/cmd.Version=${GITHUB_REF_NAME#v}"
            CGO_ENABLED: "0"
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: "go.mod"

            - run: go mod download
            - run: mkdir -p dist
            - parallel:
                  - run: |
                        GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$FLAGS" -o rx ./cli/rx
                        tar -czf "dist/radix-cli_Linux_x86_64.tar.gz" rx

                  - run: |
                        GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$FLAGS" -o rx ./cli/rx
                        tar -czf "dist/radix-cli_Linux_arm64.tar.gz" rx

                  - run: |
                        GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$FLAGS" -o rx ./cli/rx
                        tar -czf "dist/radix-cli_Darwin_x86_64.tar.gz" rx

                  - run: |
                        GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$FLAGS" -o rx ./cli/rx
                        tar -czf "dist/radix-cli_Darwin_arm64.tar.gz" rx

                  - run: |
                        GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$FLAGS" -o rx.exe ./cli/rx
                        tar -czf "dist/radix-cli_Windows_x86_64.tar.gz" rx.exe

                  - run: |
                        GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$FLAGS" -o rx.exe ./cli/rx
                        tar -czf "dist/radix-cli_Windows_arm64.tar.gz" rx.exe

            - name: Generate checksums
              run: |
                  set -euo pipefail
                  cd dist
                  sha256sum *.tar.gz > checksums.txt

            - name: Attach artifacts to draft release and publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
                  gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"

    docker:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set version
              id: version
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Log in to the Container registry
              uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  provenance: false
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
